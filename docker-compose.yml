version: '3.8'

services:
  # ==========================================
  # 1. Interface Web (Frontend React / Vite via Nginx)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: iesb-chat-web
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - iesb-net

  # ==========================================
  # 2. Backend Principal (NestJS)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: iesb-chat-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgres://chat:chat_dev@postgres:5432/chat_historico
    depends_on:
      - postgres
    volumes:
      - ./apps/backend:/app/apps/backend # Permite hot-reload/sincronização opcional
    networks:
      - iesb-net

  # ==========================================
  # 3. Cérebro de IA (Mastra Core)
  # ==========================================
  mastra-core:
    build:
      context: .
      dockerfile: apps/mastra-core/Dockerfile
    container_name: iesb-chat-mastra
    ports:
      - "4111:4111"
    environment:
      - PORT=4111
      - NODE_ENV=development
      # Facilita a comunicação caso a LLM esteja rodando direto na sua máquina física (ex: Ollama)
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
    networks:
      - iesb-net

  # ==========================================
  # 4. Servidor MCP Customizado (CRUD / Legados)
  # ==========================================
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: iesb-chat-mcp
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
    networks:
      - iesb-net

  # ==========================================
  # 5. Banco do histórico de conversas (PostgreSQL)
  # ==========================================
  # Credenciais só de desenvolvimento. Porta 5433 no host para não brigar com um Postgres local.
  postgres:
    image: postgres:17.6-alpine
    container_name: iesb-chat-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=chat
      - POSTGRES_PASSWORD=chat_dev
      - POSTGRES_DB=chat_historico
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iesb-net

networks:
  iesb-net:
    driver: bridge

volumes:
  postgres-data:
